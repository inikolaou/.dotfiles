set -g default-terminal "screen-256color"

set -g prefix C-Space
unbind C-b
bind-key C-Space send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

set -g @yank_selection_mouse 'clipboard'

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# Window name = Claude Code's conversation title (it sets the pane title; the
# leading ✳ changes while it works), otherwise the running program. "init" is
# what WSL reports while Claude runs a Windows program (pwsh.exe, explorer.exe)
set -g automatic-rename on
set -g automatic-rename-format '#{?#{||:#{==:#{pane_current_command},claude},#{==:#{pane_current_command},init}},#{=30:pane_title},#{pane_current_command}}'

# Day dashboard (~/clients/bin/today): t = popup over anything, T = self-refreshing window
bind t display-popup -E -w 90% -h 85% "/home/inikolaou/clients/bin/today --popup"
bind T run-shell "tmux select-window -t '=today' 2>/dev/null || tmux new-window -n today '/home/inikolaou/clients/bin/today --watch'"

# Moving between Claude windows: Tab = back to the previous window (l is resize),
# g = go: pick any Claude window, most urgent first (~/clients/bin/cj; j is resize)
bind Tab last-window
bind g display-popup -E -w 80% -h 60% "/home/inikolaou/clients/bin/cj"
# e = end: ask the Claude in this pane for a closing status (~/.claude/skills/wrap); a sentence, so sessions started before the skill existed understand it too
bind e if-shell -F '#{||:#{==:#{pane_current_command},claude},#{==:#{pane_current_command},init}}' 'send-keys C-u ; send-keys -l "Re-read ~/.claude/skills/wrap/SKILL.md now (it may have changed since you last read it) and follow it." ; send-keys Enter' 'display-message "No Claude in this pane"'
# i = in: file the copied Teams/Outlook text for this client (~/clients/bin/inbox)
bind i run-shell -b 'c="#{session_name}"; d="$HOME/clients/$c"; if [ -f "$d/.envrc" ]; then (cd "$d" && direnv exec . "$HOME/clients/bin/inbox" add --clipboard >/dev/null 2>&1 &); tmux display-message "📥 filing the clipboard for $c, a notification follows"; else tmux display-message "Not in a client tmux session (cs <client>)"; fi'
# Inbox: pick today's open entries for this client and mark them done (Tab selects several)
bind D if-shell '[ -f "$HOME/clients/#{session_name}/.envrc" ]' 'display-popup -E -w 90% -h 50% -d "/home/inikolaou/clients/#{session_name}" "direnv exec . $HOME/clients/bin/inbox pick"' 'display-message "Not in a client tmux session (cs <client>)"'
# H = help: the step-by-step workflow (~/clients/WORKFLOW.md)
bind H display-popup -E -w 90% -h 90% "less -R /home/inikolaou/clients/WORKFLOW.md"

# Clicking a Claude notification switches to its window (~/clients/bin/tmux-jump);
# the watcher lives as long as the tmux server and runs only once
run-shell -b '/home/inikolaou/clients/bin/tmux-jump --watch'

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @themepack 'powerline/default/cyan'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'